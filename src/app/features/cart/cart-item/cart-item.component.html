<article class="cart-item">
  <img class="cart-item__image" [src]="item().product.image" [alt]="item().product.name" />
  <div class="cart-item__info">
    <h3 class="cart-item__name">{{ item().product.name }}</h3>
    <p class="cart-item__unit">{{ item().product.price | bolivianos }} c/u</p>
    <div class="cart-item__controls">
      <app-quantity-stepper
        [quantity]="item().quantity"
        (decreased)="decrease()"
        (increased)="increase()"
      />
      <strong class="cart-item__subtotal">{{ item().product.price * item().quantity | bolivianos }}</strong>
    </div>
  </div>
  <button class="cart-item__remove" type="button" aria-label="Quitar del pedido" (click)="remove()">
    <app-icon name="trash" [size]="18" />
  </button>
</article>
